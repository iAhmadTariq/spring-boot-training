databaseChangeLog:
  - changeSet:
      id: create-news-table
      author: ahmad.tariq
      changes:
        - createTable:
            tableName: news
            columns:
              - column:
                  name: news_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_news
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: author
                  type: VARCHAR(255)
              - column:
                  name: reported_at
                  type: TIMESTAMP
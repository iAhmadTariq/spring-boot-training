<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Welcome</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="card">
    <h1 class="title">Welcome to Spring Boot</h1>
    <p class="subtitle">A minimalist web app running on Java 25 & Spring Boot 4.0.7</p>

    <div class="interactive-section">
        <button id="fetch-btn">Check Server Info</button>
        <div id="info-container" class="hidden">
            <p><strong>Status:</strong> <span id="status">...</span></p>
            <p><strong>Framework:</strong> <span id="framework">...</span></p>
            <p><strong>Runtime:</strong> <span id="runtime">...</span></p>
        </div>
    </div>
</div>

<script src="/js/script.js"></script>
</body>
</html>

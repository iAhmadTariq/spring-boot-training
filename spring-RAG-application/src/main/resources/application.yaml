spring:
  application:
    name: spring-practice-5
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
        embedding:
          api-key: ${GOOGLE_API_KEY}
          text:
            options:
              model: gemini-embedding-001
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  rag:
    chunk-max-tokens: 800
    similarity-threshold: 0.6
    top-k: 5
    vector-store-persist-path: ./data/vector-store.json

logging:
  level:
    sql: debug
    liquibase: debug
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
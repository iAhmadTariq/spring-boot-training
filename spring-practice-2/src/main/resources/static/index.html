<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">📰</span>
      <span>News Manager</span>
    </div>
    <button id="btn-new" class="btn btn-primary" type="button">
      <span aria-hidden="true">+</span> New Article
    </button>
  </header>

  <main class="page">
    <div class="toolbar">
      <div class="search-field">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search this page by title or author…" autocomplete="off" />
      </div>
      <span id="result-count" class="result-count"></span>
    </div>

    <div id="error-banner" class="error-banner hidden" role="alert"></div>

    <div id="loading" class="state-message">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading articles…</p>
    </div>

    <div id="empty-state" class="state-message hidden">
      <p class="state-emoji" aria-hidden="true">🗞️</p>
      <p>No articles yet.</p>
      <button id="btn-empty-new" class="btn btn-secondary" type="button">Create your first article</button>
    </div>

    <section id="news-grid" class="news-grid" aria-live="polite"></section>

    <div id="pagination" class="pagination hidden">
      <label class="page-size-label">
        Per page
        <select id="page-size-select">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </label>
      <div class="pagination-controls">
        <button id="btn-prev-page" class="btn btn-secondary" type="button">‹ Prev</button>
        <span id="page-indicator" class="page-indicator"></span>
        <button id="btn-next-page" class="btn btn-secondary" type="button">Next ›</button>
      </div>
    </div>
  </main>

  <dialog id="article-dialog" class="dialog">
    <form id="article-form" method="dialog" class="dialog-form" novalidate>
      <h2 id="dialog-title">New Article</h2>

      <div class="field">
        <label for="field-id">News ID</label>
        <input id="field-id" name="newsId" type="number" min="1" required />
        <p class="field-hint">Must be unique. We suggest the next free ID for you.</p>
      </div>

      <div class="field">
        <label for="field-title">Title</label>
        <input id="field-title" name="title" type="text" maxlength="255" required />
      </div>

      <div class="field">
        <label for="field-author">Author</label>
        <input id="field-author" name="author" type="text" maxlength="255" required />
      </div>

      <div class="field">
        <label for="field-date">Reported At</label>
        <input id="field-date" name="reportedAt" type="datetime-local" required />
      </div>

      <div class="field">
        <label for="field-description">Description</label>
        <textarea id="field-description" name="description" rows="4" maxlength="1000"></textarea>
      </div>

      <p id="form-error" class="form-error hidden"></p>

      <div class="dialog-actions">
        <button type="button" id="btn-cancel" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="btn-save" class="btn btn-primary">Save Article</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="dialog dialog-small">
    <div class="dialog-form">
      <h2>Delete article?</h2>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="dialog-actions">
        <button type="button" id="btn-confirm-cancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="btn-confirm-delete" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </dialog>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="js/script.js"></script>
</body>
</html>

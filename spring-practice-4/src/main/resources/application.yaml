spring:
  application:
    name: spring-practice-4

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

logging.level:
  sql: debug
  liquibase: debug
  web: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 0.1
    export:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: spring-practice-4

app:
  name:
    welcome: "${APP_MESSAGE_WELCOME:${app.message.welcome:Hello!}}"

jwt:
  secret: ${JWT_SECRET}
